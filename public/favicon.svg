<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    站点标记：三体问题的 8 字周期解。路径由 scripts/gen-mark.mjs 积分采样得出，
    与 src/components/SiteMark.vue 同源（改标记时两处一起换）。不是手画的图形。

    这一份是给 16px 标签页单独调的，和页内那个标记有三处不同，
    每一处都是在 16 / 20 / 32px 三档下真栅格化比对后定下来的：

    1. 自带黑底，不用透明底。标签栏的底色浏览器不保证（浅色、深色、各种主题），
       透明底 + 黑线在深色标签栏上会整条消失。自带一块黑底才能到处都长一样。
    2. 线宽 1.6。viewBox 24 宽缩到 16px 时 1 单位 = 0.67 像素，
       2.6 的线约合 1.7 像素——在总共 16 像素的图上占了十分之一，
       两个环的内圈被自身线宽填掉，糊成一坨。1.6 约合 1.1 像素，
       仍是实心一笔，环里留得出黑。
    3. 三个质点是「打在白线上的洞」：先挖一个 r=2.4 的黑圆，
       再在洞心放一个 r=1.5 的白点。前一版质点和轨道同为黑色，等于不存在；
       现在靠反差存在，16px 下也还看得出白线上有三个结。
  -->
